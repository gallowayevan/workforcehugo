<figure {{ with .Get "class" }}class="{{.}}" {{else}}class="" {{ end }}>
    {{ if isset .Params "title" }}
    <p class="has-text-left">{{ .Get "title" | markdownify | safeHTML }}</p>
    {{ end }}
    {{/* SVGs render at full resolution in the page, so linking to the raw
         file adds nothing; only raster images link to their full-size original. */}}
    {{- $src := .Get "src" -}}
    {{- $link := and $src (not (hasSuffix $src ".svg")) -}}
    {{ if $link }}<a href="{{ $src }}">{{ end }}
        <img src="{{ $src }}"
            alt="{{ with .Get "alt" }}{{ . }}{{ else }}{{ .Get "caption" }}{{ end }}" />
        {{ if $link }}</a>{{ end }}
    {{ if or (.Get "caption") (.Get "attr")}}
    <figcaption class="is-size-7 has-text-left">
        {{ if or (.Get "caption") (.Get "attr")}}<p>
            {{ .Get "caption" | markdownify }}
            {{ with .Get "attrlink"}}<a href="{{.}}"> {{ end }}
                {{ .Get "attr" }}
                {{ if .Get "attrlink"}}</a> {{ end }}
        </p> {{ end }}
    </figcaption>
    {{ end }}
</figure>
<!-- image -->
